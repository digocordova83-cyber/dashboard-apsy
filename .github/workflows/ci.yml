name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/dashboard_apsy
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Executar testes determinísticos
        run: pnpm test:ci

      - name: Verificar TypeScript
        run: pnpm check

      - name: Gerar build de produção
        run: pnpm build
